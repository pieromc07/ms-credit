spring:
  application:
    name: ms-credit
  config:
    import:
      - optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
      - optional:classpath:mongo-credentials.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${SERVER_PORT:8082}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  issuer: ms-customer
  public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:secrets/jwt-public-key.pem}

credit:
  overdue:
    reconciliation-interval: ${OVERDUE_RECONCILIATION_INTERVAL:PT1M}
